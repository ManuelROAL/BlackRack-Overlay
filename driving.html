<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#080b10" />
    <title>LMU · Trailing + Pedal</title>
  </head>
  <body class="driving-body">
    <main class="driving-shell" data-tauri-drag-region>
      <section class="trailing-panel" aria-label="Historial de pedales">
        <canvas id="trailing-canvas" width="175" height="72"></canvas>
        <div class="trailing-legend">
          <span><i class="throttle-mark"></i>THR</span>
          <span><i class="brake-mark"></i>BRK</span>
          <span><i class="clutch-mark"></i>CLT</span>
          <span><i class="tc-mark"></i>TC</span>
          <span><i class="abs-mark"></i>ABS</span>
        </div>
      </section>
      <section class="pedal-panel" aria-label="Pedales actuales">
        <div class="pedal-column clutch-column">
          <b id="clutch-value">0</b>
          <div class="pedal-column-track"><i id="clutch-level"></i></div>
          <span>CLT</span>
        </div>
        <div class="pedal-column brake-column">
          <b id="brake-value">0</b>
          <div class="pedal-column-track"><i id="brake-level"></i></div>
          <span>BRK</span>
        </div>
        <div class="pedal-column">
          <b id="throttle-value">0</b>
          <div class="pedal-column-track"><i id="throttle-level"></i></div>
          <span>THR</span>
        </div>
      </section>
      <section class="driving-readout" aria-label="Velocidad, marcha y Force Feedback">
        <div class="driving-primary">
          <strong id="gear">N</strong>
          <div class="speed-readout"><b id="speed">0</b><span>KM/H</span></div>
        </div>
        <div class="ffb-readout">
          <span>FF</span>
          <div class="ffb-track" aria-hidden="true"><i id="ffb-level"></i><em></em></div>
        </div>
      </section>
      <section class="steering-panel" aria-label="Ángulo del volante">
        <div id="steering-wheel" class="steering-wheel" aria-hidden="true">
          <svg viewBox="0 0 100 100">
            <circle cx="50" cy="50" r="38"></circle>
            <circle cx="50" cy="50" r="6"></circle>
            <path d="M13 44h74M50 56 27 78M50 56l23 22"></path>
          </svg>
        </div>
        <b id="steering-angle">0°</b>
      </section>
      <div class="resize-handle" data-resize-handle aria-hidden="true"></div>
    </main>
    <script type="module" src="/src/driving.ts"></script>
  </body>
</html>
