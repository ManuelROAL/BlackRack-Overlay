<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#080b10" />
    <title data-i18n="title.tiretemps">LMU · Temperatura de neumáticos</title>
  </head>
  <body class="tiretemps-body">
    <main class="tiretemps-shell" data-tauri-drag-region>
      <section class="tiretemps-layout" data-i18n-aria-label="tiretemps.layoutAria" aria-label="Temperatura detallada de neumáticos y frenos">
        <article class="temperature-wheel wheel-fl" data-wheel="0">
          <div class="tread-zones">
            <div class="temperature-layer" data-temperature="surface"><b data-i18n="tiretemps.surfaceShort">SUP</b><span class="tread-zone" data-zone="left"><strong>--°</strong></span><span class="tread-zone" data-zone="center"><strong>--°</strong></span><span class="tread-zone" data-zone="right"><strong>--°</strong></span></div>
            <div class="temperature-layer" data-temperature="innerLayer"><b data-i18n="tiretemps.innerLayerShort">INT</b><span class="tread-zone" data-zone="left"><strong>--°</strong></span><span class="tread-zone" data-zone="center"><strong>--°</strong></span><span class="tread-zone" data-zone="right"><strong>--°</strong></span></div>
            <div class="temperature-layer" data-temperature="carcass"><b data-i18n="tiretemps.carcassShort">CAR</b><span class="tread-zone carcass-zone"><strong>--°</strong></span></div>
          </div>
        </article>
        <div class="brake brake-fl" data-brake="0"><span></span><strong>---°</strong></div>
        <div class="brake brake-fr" data-brake="1"><span></span><strong>---°</strong></div>
        <article class="temperature-wheel wheel-fr" data-wheel="1">
          <div class="tread-zones">
            <div class="temperature-layer" data-temperature="surface"><b data-i18n="tiretemps.surfaceShort">SUP</b><span class="tread-zone" data-zone="left"><strong>--°</strong></span><span class="tread-zone" data-zone="center"><strong>--°</strong></span><span class="tread-zone" data-zone="right"><strong>--°</strong></span></div>
            <div class="temperature-layer" data-temperature="innerLayer"><b data-i18n="tiretemps.innerLayerShort">INT</b><span class="tread-zone" data-zone="left"><strong>--°</strong></span><span class="tread-zone" data-zone="center"><strong>--°</strong></span><span class="tread-zone" data-zone="right"><strong>--°</strong></span></div>
            <div class="temperature-layer" data-temperature="carcass"><b data-i18n="tiretemps.carcassShort">CAR</b><span class="tread-zone carcass-zone"><strong>--°</strong></span></div>
          </div>
        </article>

        <article class="temperature-wheel wheel-rl" data-wheel="2">
          <div class="tread-zones">
            <div class="temperature-layer" data-temperature="surface"><b data-i18n="tiretemps.surfaceShort">SUP</b><span class="tread-zone" data-zone="left"><strong>--°</strong></span><span class="tread-zone" data-zone="center"><strong>--°</strong></span><span class="tread-zone" data-zone="right"><strong>--°</strong></span></div>
            <div class="temperature-layer" data-temperature="innerLayer"><b data-i18n="tiretemps.innerLayerShort">INT</b><span class="tread-zone" data-zone="left"><strong>--°</strong></span><span class="tread-zone" data-zone="center"><strong>--°</strong></span><span class="tread-zone" data-zone="right"><strong>--°</strong></span></div>
            <div class="temperature-layer" data-temperature="carcass"><b data-i18n="tiretemps.carcassShort">CAR</b><span class="tread-zone carcass-zone"><strong>--°</strong></span></div>
          </div>
        </article>
        <div class="brake brake-rl" data-brake="2"><span></span><strong>---°</strong></div>
        <div class="brake brake-rr" data-brake="3"><span></span><strong>---°</strong></div>
        <article class="temperature-wheel wheel-rr" data-wheel="3">
          <div class="tread-zones">
            <div class="temperature-layer" data-temperature="surface"><b data-i18n="tiretemps.surfaceShort">SUP</b><span class="tread-zone" data-zone="left"><strong>--°</strong></span><span class="tread-zone" data-zone="center"><strong>--°</strong></span><span class="tread-zone" data-zone="right"><strong>--°</strong></span></div>
            <div class="temperature-layer" data-temperature="innerLayer"><b data-i18n="tiretemps.innerLayerShort">INT</b><span class="tread-zone" data-zone="left"><strong>--°</strong></span><span class="tread-zone" data-zone="center"><strong>--°</strong></span><span class="tread-zone" data-zone="right"><strong>--°</strong></span></div>
            <div class="temperature-layer" data-temperature="carcass"><b data-i18n="tiretemps.carcassShort">CAR</b><span class="tread-zone carcass-zone"><strong>--°</strong></span></div>
          </div>
        </article>
      </section>
    </main>
    <script type="module" src="/src/tiretemps.ts"></script>
  </body>
</html>
