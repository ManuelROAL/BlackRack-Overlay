<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title data-i18n="title.trackmap">LMU · Mapa del circuito</title>
  </head>
  <body class="trackmap-body">
    <main class="trackmap-shell" data-tauri-drag-region>
      <svg id="trackmap" viewBox="0 0 420 420" role="img" aria-label="Mapa del circuito" data-i18n-aria-label="trackmap.aria">
        <path id="pit-outline" class="pit-outline"></path>
        <path id="pit-line" class="pit-line"></path>
        <path id="track-outline" class="track-outline"></path>
        <path id="track-line" class="track-line"></path>
        <path id="start-line" class="start-line"></path>
      </svg>
      <div id="vehicle-layer" class="vehicle-layer" aria-hidden="true"></div>
      <div id="map-status" class="map-status" data-i18n="trackmap.learning">APRENDIENDO CIRCUITO</div>
    </main>
    <script type="module" src="/src/trackmap.ts"></script>
  </body>
</html>
