<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>LMU · Mapa del circuito</title>
  </head>
  <body class="trackmap-body">
    <main class="trackmap-shell" data-tauri-drag-region>

      <div id="map-status" class="map-status">APRENDIENDO CIRCUITO</div>
    </main>
    <script type="module" src="/src/trackmap.ts"></script>
