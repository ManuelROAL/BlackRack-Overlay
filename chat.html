<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title data-i18n="title.chat">Chat</title>
  </head>
  <body class="chat-body">
    <main id="chat-card" class="overlay-shell chat-card" data-state="waiting" data-tauri-drag-region>
      <header class="chat-header" data-tauri-drag-region>
        <span data-i18n="chat.title">CHAT</span>
        <b id="chat-count">--</b>
      </header>
      <ol id="chat-messages" class="chat-messages" aria-label="Chat de la sesión" data-i18n-aria-label="chat.aria"></ol>
      <p id="chat-empty" class="chat-empty" data-i18n="chat.empty">ESPERANDO MENSAJES</p>
    </main>
    <script type="module" src="/src/chat.ts"></script>
  </body>
</html>
