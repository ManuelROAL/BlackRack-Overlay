<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#080b10" />
    <title data-i18n="title.tires">LMU · Daños y neumáticos</title>
  </head>
  <body class="tires-body">
    <main class="tires-shell" data-tauri-drag-region>
      <section class="vehicle-layout" aria-label="Estado de daños y neumáticos" data-i18n-aria-label="tires.layoutAria" data-tauri-drag-region>
        <article class="wheel wheel-fl" data-wheel="0" data-tauri-drag-region>
          <div class="wheel-data">
            <span class="wheel-temperature">--.-°</span>
            <strong class="wheel-wear">--%</strong>
            <span class="wheel-flatspot">--.--%</span>
            <span class="wheel-brake-temperature">---°</span>
          </div>
          <span class="wheel-visual" aria-hidden="true"><span class="wheel-tread"><span class="tread-zone"></span><span class="tread-zone"></span><span class="tread-zone"></span></span><span class="brake-disc"></span><span class="suspension-arm"></span></span>
        </article>
        <article class="wheel wheel-fr" data-wheel="1" data-tauri-drag-region>
          <span class="wheel-visual" aria-hidden="true"><span class="suspension-arm"></span><span class="brake-disc"></span><span class="wheel-tread"><span class="tread-zone"></span><span class="tread-zone"></span><span class="tread-zone"></span></span></span>
          <div class="wheel-data">
            <span class="wheel-temperature">--.-°</span>
            <strong class="wheel-wear">--%</strong>
            <span class="wheel-flatspot">--.--%</span>
            <span class="wheel-brake-temperature">---°</span>
          </div>
        </article>
        <article class="wheel wheel-rl" data-wheel="2" data-tauri-drag-region>
          <div class="wheel-data">
            <span class="wheel-temperature">--.-°</span>
            <strong class="wheel-wear">--%</strong>
            <span class="wheel-flatspot">--.--%</span>
            <span class="wheel-brake-temperature">---°</span>
          </div>
          <span class="wheel-visual" aria-hidden="true"><span class="wheel-tread"><span class="tread-zone"></span><span class="tread-zone"></span><span class="tread-zone"></span></span><span class="brake-disc"></span><span class="suspension-arm"></span></span>
        </article>
        <article class="wheel wheel-rr" data-wheel="3" data-tauri-drag-region>
          <span class="wheel-visual" aria-hidden="true"><span class="suspension-arm"></span><span class="brake-disc"></span><span class="wheel-tread"><span class="tread-zone"></span><span class="tread-zone"></span><span class="tread-zone"></span></span></span>
          <div class="wheel-data">
            <span class="wheel-temperature">--.-°</span>
            <strong class="wheel-wear">--%</strong>
            <span class="wheel-flatspot">--.--%</span>
            <span class="wheel-brake-temperature">---°</span>
          </div>
        </article>

        <div class="chassis" data-tauri-drag-region>
          <svg class="chassis-map" viewBox="0 0 82 160" role="img" aria-label="Ocho zonas de daño del chasis" data-i18n-aria-label="tires.chassisAria">
            <path class="chassis-outline" d="M20 7Q41-1 62 7q10 3 12 17l2 20-1 67-5 24q-4 13-18 16H30q-14-3-18-16l-5-24-1-67 2-20Q10 10 20 7Z" />
            <path class="chassis-part part-front-left" data-damage-part="1" d="M20 7Q10 10 8 24L6 42" />
            <path class="chassis-part part-front-center" data-damage-part="0" d="M20 7Q41-1 62 7" />
            <path class="chassis-part part-front-right" data-damage-part="7" d="M62 7q10 3 12 17l2 18" />
            <path class="chassis-part part-center-left" data-damage-part="2" d="M6 49l1 62" />
            <path class="chassis-part part-center-right" data-damage-part="6" d="M76 49l-1 62" />
            <path class="chassis-part part-rear-left" data-damage-part="3" d="M7 118l5 17q4 13 18 16" />
            <path class="chassis-part part-rear-center" data-damage-part="4" d="M30 151h22" />
            <path class="chassis-part part-rear-right" data-damage-part="5" d="M52 151q14-3 18-16l5-17" />
            <path class="aero-wing" data-aero-wing d="M13 157h56" />
          </svg>
          <div class="engine-stack" data-tauri-drag-region>
            <span class="engine-temperature engine-oil-temperature" data-engine-temperature="oil" hidden>
              <i aria-hidden="true"></i><strong>--°</strong>
            </span>
            <span class="engine-status" data-engine-status role="img" aria-label="Motor"></span>
            <span class="engine-temperature engine-water-temperature" data-engine-temperature="water" hidden>
              <i aria-hidden="true"></i><strong>--°</strong>
            </span>
            <div class="damage-summary" data-tauri-drag-region><span>DMG</span><strong id="damage-value">0%</strong></div>
          </div>
        </div>
      </section>
    </main>
    <script type="module" src="/src/tires.ts"></script>
  </body>
</html>
