<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#080b10" />
    <title>LMU · Daños y neumáticos</title>
  </head>
  <body class="tires-body">
    <main class="tires-shell" data-tauri-drag-region>
      <section class="vehicle-layout" aria-label="Estado de daños y neumáticos" data-tauri-drag-region>
        <article class="wheel wheel-fl" data-wheel="0" data-tauri-drag-region>
          <div class="wheel-data">
            <header><span>FL</span><img data-compound alt="" /></header>
            <strong class="wheel-wear">--%</strong>
            <span class="metric metric-tire"><i>N</i><b class="wheel-temperature">--.-°</b></span>
            <span class="metric metric-brake"><i>F</i><b class="wheel-brake-temperature">---°</b></span>
            <span class="metric"><i>PL</i><b class="wheel-flatspot">--.--%</b></span>
            <span class="metric"><i>S</i><b class="wheel-suspension">--%</b></span>
          </div>
          <span class="wheel-visual" aria-hidden="true"><span class="wheel-tread"></span><span class="brake-disc"></span><span class="suspension-arm"></span></span>
        </article>
        <article class="wheel wheel-fr" data-wheel="1" data-tauri-drag-region>
          <span class="wheel-visual" aria-hidden="true"><span class="suspension-arm"></span><span class="brake-disc"></span><span class="wheel-tread"></span></span>
          <div class="wheel-data">
            <header><span>FR</span><img data-compound alt="" /></header>
            <strong class="wheel-wear">--%</strong>
            <span class="metric metric-tire"><i>N</i><b class="wheel-temperature">--.-°</b></span>
            <span class="metric metric-brake"><i>F</i><b class="wheel-brake-temperature">---°</b></span>
            <span class="metric"><i>PL</i><b class="wheel-flatspot">--.--%</b></span>
            <span class="metric"><i>S</i><b class="wheel-suspension">--%</b></span>
          </div>
        </article>
        <article class="wheel wheel-rl" data-wheel="2" data-tauri-drag-region>
          <div class="wheel-data">
            <header><span>RL</span><img data-compound alt="" /></header>
            <strong class="wheel-wear">--%</strong>
            <span class="metric metric-tire"><i>N</i><b class="wheel-temperature">--.-°</b></span>
            <span class="metric metric-brake"><i>F</i><b class="wheel-brake-temperature">---°</b></span>
            <span class="metric"><i>PL</i><b class="wheel-flatspot">--.--%</b></span>
            <span class="metric"><i>S</i><b class="wheel-suspension">--%</b></span>
          </div>
          <span class="wheel-visual" aria-hidden="true"><span class="wheel-tread"></span><span class="brake-disc"></span><span class="suspension-arm"></span></span>
        </article>
        <article class="wheel wheel-rr" data-wheel="3" data-tauri-drag-region>
          <span class="wheel-visual" aria-hidden="true"><span class="suspension-arm"></span><span class="brake-disc"></span><span class="wheel-tread"></span></span>
          <div class="wheel-data">
            <header><span>RR</span><img data-compound alt="" /></header>
            <strong class="wheel-wear">--%</strong>
            <span class="metric metric-tire"><i>N</i><b class="wheel-temperature">--.-°</b></span>
            <span class="metric metric-brake"><i>F</i><b class="wheel-brake-temperature">---°</b></span>
            <span class="metric"><i>PL</i><b class="wheel-flatspot">--.--%</b></span>
            <span class="metric"><i>S</i><b class="wheel-suspension">--%</b></span>
          </div>
        </article>

        <div class="chassis" data-tauri-drag-region>
          <svg class="chassis-map" viewBox="0 0 82 154" role="img" aria-label="Ocho zonas de daño del chasis">
            <path class="chassis-outline" d="M24 3Q41-1 58 3q13 4 17 20l4 24-2 59-5 28q-5 17-19 19H29q-14-2-19-19l-5-28-2-59 4-24Q11 7 24 3Z" />
            <path class="chassis-part part-front" data-damage-part="0" d="M23 4Q41-1 59 4l3 15-21 7-21-7Z" />
            <path class="chassis-part part-rear" data-damage-part="4" d="m53 136 9 13q-21 9-42 0l9-13q12 7 24 0Z" />
            <path class="chassis-part part-rear-left" data-damage-part="5" d="m20 109-13-3 4 27 9 15 8-13Z" />
            <path class="chassis-part part-left" data-damage-part="6" d="m19 44-14 3 2 57 13 3 2-43Z" />
            <path class="chassis-part part-front-left" data-damage-part="7" d="m21 5-9 8-6 31 14-3 3-20Z" />
            <path class="chassis-part part-front-right" data-damage-part="1" transform="translate(82 0) scale(-1 1)" d="m21 5-9 8-6 31 14-3 3-20Z" />
            <path class="chassis-part part-right" data-damage-part="2" transform="translate(82 0) scale(-1 1)" d="m19 44-14 3 2 57 13 3 2-43Z" />
            <path class="chassis-part part-rear-right" data-damage-part="3" transform="translate(82 0) scale(-1 1)" d="m20 109-13-3 4 27 9 15 8-13Z" />
            <path class="cockpit" d="M29 34q12-8 24 0l6 31-3 54q-15 12-30 0l-3-54Z" />
            <path class="windscreen" d="M29 35q12-8 24 0l4 20H25Z" />
          </svg>
          <div class="damage-summary" data-tauri-drag-region><span>DMG</span><strong id="damage-value">0%</strong></div>
        </div>
      </section>
    </main>
    <script type="module" src="/src/tires.ts"></script>
  </body>
</html>
