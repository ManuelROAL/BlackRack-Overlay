<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title data-i18n="title.timing">Timing</title>
  </head>
  <body class="timing-body">
    <main id="timing-card" class="overlay-shell timing-card" data-state="waiting" data-tauri-drag-region>
      <header class="timing-header"><span data-i18n="timing.lapNumber">VUELTA</span><b id="timing-lap-number">--</b></header>
      <section id="timing-times" class="timing-times">
        <div data-time="current" data-time-id="current"><span data-i18n="timing.current">ACTUAL</span><b id="timing-current">--:--.---</b></div>
        <div data-time="session-best" data-time-id="sessionPersonalBest"><span data-i18n="timing.sessionPersonalBest">MEJOR DE SESIÓN</span><b id="timing-session-best">--:--.---</b><small id="timing-session-best-comparison" hidden></small></div>
        <div data-time="personal-best" data-time-id="personalBest"><span data-i18n="timing.personalBest">MEJOR PERSONAL</span><b id="timing-personal-best">--:--.---</b><small id="timing-personal-best-comparison" hidden></small></div>
        <div data-time="last" data-time-id="last"><span data-i18n="timing.last">ÚLTIMA</span><b id="timing-last">--:--.---</b><small id="timing-last-comparison" hidden></small></div>
        <div data-time="average" data-time-id="average"><span data-i18n="timing.average">PROMEDIO</span><b id="timing-average">--:--.---</b><small id="timing-average-comparison" hidden></small></div>
        <div data-time="optimal" data-time-id="optimal"><span data-i18n="timing.optimal">ÓPTIMA</span><b id="timing-optimal">--:--.---</b><small id="timing-optimal-comparison" hidden></small></div>
        <div data-time="estimated" data-time-id="estimated"><span data-i18n="timing.estimated">ESTIMADA</span><b id="timing-estimated">--:--.---</b></div>
      </section>
      <section id="timing-sectors" class="timing-sectors" aria-label="Sectores" data-i18n-aria-label="timing.sectorsAria">
        <div data-sector="0"><span>S1</span><b>--.---</b></div>
        <div data-sector="1"><span>S2</span><b>--.---</b></div>
        <div data-sector="2"><span>S3</span><b>--.---</b></div>
      </section>
      <ol id="timing-history" class="timing-history" aria-label="Últimas vueltas" data-i18n-aria-label="timing.historyAria"></ol>
    </main>
    <script type="module" src="/src/timing.ts"></script>
  </body>
</html>
