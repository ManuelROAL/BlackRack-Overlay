<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#080b10" />
    <title>LMU · Dashboard</title>
  </head>
  <body>
    <main class="overlay-shell">
      <header class="topbar" data-tauri-drag-region>
        <div class="brand" data-tauri-drag-region>
          <span class="brand-mark">LMU</span>
          <span>DASHBOARD</span>
        </div>
        <div class="connection" data-tauri-drag-region>
          <span class="status-dot"></span>
          <span id="source-status">ESPERANDO LMU</span>
        </div>
        <div id="interaction-mode" class="mode-pill" data-tauri-drag-region>
          EDICIÓN · CTRL+SHIFT+O
        </div>
      </header>

      <section class="dashboard">
        <article class="widget speed-widget">
          <p class="widget-label">VELOCIDAD</p>
          <div class="speed-row">
            <strong id="speed">000</strong>
            <span>KM/H</span>
          </div>
          <div class="pedals" aria-label="Entradas de acelerador y freno">
            <div class="pedal">
              <span>THR</span>
              <div class="pedal-track"><i id="throttle-bar"></i></div>
              <b id="throttle">0%</b>
            </div>
            <div class="pedal brake">
              <span>BRK</span>
              <div class="pedal-track"><i id="brake-bar"></i></div>
              <b id="brake">0%</b>
            </div>
          </div>
        </article>

        <article class="widget gear-widget">
          <p class="widget-label">MARCHA</p>
          <strong id="gear">N</strong>
          <div class="rpm-track" aria-label="Revoluciones del motor">
            <i id="rpm-bar"></i>
          </div>
          <span id="rpm">0 RPM</span>
        </article>

        <article class="widget timing-widget">
          <p class="widget-label icon-label"><img src="/src/assets/lmu-icons/timing.svg" width="14" height="14" alt="" aria-hidden="true" />VUELTA ACTUAL</p>
          <strong id="lap-time">00:00.000</strong>
          <div class="timing-row">
            <span>DELTA</span>
            <b id="lap-delta">+0.000</b>
          </div>
          <div class="timing-row secondary">
            <span>MEJOR</span>
            <b id="best-lap">00:00.000</b>
          </div>
        </article>

        <article class="widget fuel-widget">
          <p class="widget-label icon-label"><img src="/src/assets/lmu-icons/fuel.svg" width="14" height="14" alt="" aria-hidden="true" /><span id="dashboard-resource-label">COMBUSTIBLE</span></p>
          <div class="fuel-value">
            <strong id="fuel">0.0</strong><span id="dashboard-resource-unit">L</span>
          </div>
          <div class="fuel-track"><i id="fuel-bar"></i></div>
          <div class="fuel-meta">
            <span id="dashboard-range-label">VUELTAS EST.</span>
            <b id="fuel-laps">--</b>
          </div>
        </article>
      </section>

      <footer data-tauri-drag-region>
        <span>FUENTE: <b id="source-name">LMU</b></span>
        <span>20 HZ</span>
        <span>ARRASTRA PARA COLOCAR</span>
      </footer>
    </main>
    <script type="module" src="/src/dashboard.ts"></script>
  </body>
</html>
