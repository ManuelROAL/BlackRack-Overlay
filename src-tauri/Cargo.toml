[package]
name = "blackrack-overlay"
version = "0.7.5"
description = "Overlay multiplataforma de telemetría para Le Mans Ultimate"
authors = ["BlackRack Overlay contributors"]
edition = "2021"

[lib]
name = "blackrack_overlay_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
# Simulators that are still being filled in one overlay at a time. Off by
# default so a build handed to testers never offers one; the module itself is
# always compiled and tested, so it cannot rot while it waits.
experimental-simulators = []

[build-dependencies]
cc = "1"
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-global-shortcut = "2"

[target.'cfg(windows)'.dependencies]
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
windows-sys = { version = "0.61", features = ["Win32_Devices_Display", "Win32_Foundation", "Win32_Graphics_Gdi", "Win32_System_Memory", "Win32_System_Threading", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }

[profile.release]
lto = "fat"
codegen-units = 1
strip = "symbols"
